name: Release

# Builds the Windows installer/portable .exe and the Android .apk.
# - Push a tag like v0.0.1 → builds and publishes a GitHub Release with both files.
# - Run manually (Actions → Release → Run workflow) → builds and uploads them as workflow artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          for f in package.json apps/web/package.json apps/desktop/package.json packages/core/package.json; do
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('$f'));p.version='$V';fs.writeFileSync('$f',JSON.stringify(p,null,2)+'\n')"
          done
      - run: npm ci
      - run: npm run build
      # electron-builder needs the desktop app's runtime deps (ws) next to it, not hoisted to the root.
      - name: Install desktop dependencies standalone
        working-directory: apps/desktop
        run: npm install --no-workspaces --no-package-lock
      - name: Build exe
        working-directory: apps/desktop
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: GlowPilot-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          for f in package.json apps/web/package.json apps/desktop/package.json packages/core/package.json; do
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('$f'));p.version='$V';fs.writeFileSync('$f',JSON.stringify(p,null,2)+'\n')"
          done
      - run: npm ci
      - run: npm run build
      - name: Sync web app into Android project
        working-directory: apps/web
        run: npx cap sync android
      - name: Build signed APK
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          V=$(node -p "require('../web/package.json').version")
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PappVersionName="$V"
          mv app/build/outputs/apk/release/app-release.apk "GlowPilot-$V.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: GlowPilot-android
          path: apps/android/GlowPilot-*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          name: GlowPilot ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          make_latest: true
          body: |
            **Windows:** `GlowPilot-Setup-*.exe`. Installed copies update themselves automatically.
            **Android:** `GlowPilot-*.apk`. The app shows a banner when a new version is out.
            The builds are not code-signed, so Windows SmartScreen may warn on first launch ("More info" → "Run anyway").
