# GlowPilot Hub on the always-on server. Host network: LAN clients reach :47821 and BlueZ is local.
# The D-Bus system socket gives the container the server's Bluetooth (BlueZ must run on the host).
services:
  hub:
    build: .
    image: glowpilot-hub
    restart: unless-stopped
    network_mode: host
    # Ubuntu's default container AppArmor profile blocks D-Bus, hence BlueZ. Only this container is affected.
    security_opt:
      - apparmor=unconfined
    volumes:
      - ./data:/data
      - /var/run/dbus:/var/run/dbus
    environment:
      TZ: Europe/Paris
      GLOWPILOT_BLE_DEBUG: "1"
